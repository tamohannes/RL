defaults: grpo-nemotron3.5-lightning-30ba3b-1n4g-automodel-sciprobe-tool-canary.yaml
grpo:
  num_generations_per_prompt: 8
checkpointing:
  checkpoint_dir: results/sciprobe-lightning-signal-canary-r7
  checkpoint_must_save_by: 00:00:50:00
policy:
  train_global_batch_size: 8
  max_total_sequence_length: 12288
  generation:
    max_new_tokens: 8192
    temperature: 0.7
    vllm_cfg:
      http_generation_api_key_env_var: SCIPROBE_POLICY_GENERATION_TOKEN
data:
  train:
    data_path: examples/data/sciprobe/crispresso-editing-frequency-signal-canary.jsonl
env:
  nemo_gym:
    loopback_only: true
    nemo_gym_log_dir: results/sciprobe-lightning-signal-canary-r7/nemo-gym
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - responses_api_agents/sciprobe_simple_agent/configs/sciprobe_simple_agent.yaml
    - resources_servers/sciprobe_checks/configs/sciprobe_checks.yaml
    - resources_servers/sciprobe_ns_tools/configs/sciprobe_ns_tools.yaml
    policy_model:
      responses_api_models:
        vllm_model:
          api_key: null
          api_key_env_var: SCIPROBE_POLICY_GENERATION_TOKEN
          trusted_ingress_token_env_var: SCIPROBE_TRUSTED_INGRESS_TOKEN
          trusted_ingress_header_name: X-SciProbe-Trusted-Ingress
    ns_tools:
      resources_servers:
        _delete_key: ns_tools
        sciprobe_ns_tools:
          default_verifier: sciprobe_checks
          verifiers:
            sciprobe_checks:
              type: resources_servers
              name: sciprobe_checks
          nemo_skills_tool_overrides:
            DirectPythonTool:
              exec_timeout_s: 30
logger:
  log_dir: results/sciprobe-lightning-signal-canary-r7/logs
  wandb:
    name: lightning-signal-canary-r7
