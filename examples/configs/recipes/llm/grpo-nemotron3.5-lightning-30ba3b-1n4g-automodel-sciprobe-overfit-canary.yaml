defaults: grpo-nemotron3.5-lightning-30ba3b-1n4g-automodel-sciprobe-signal-canary.yaml
grpo:
  num_generations_per_prompt: 16
  max_num_steps: 6
  val_at_start: true
  val_at_end: true
  val_period: 1
  val_batch_size: null
  val_num_generations_per_prompt: 32
  use_leave_one_out_baseline: false
  use_dynamic_sampling: true
  skip_reference_policy_logprobs_calculation: true
  adv_estimator:
    normalize_rewards: true
    use_leave_one_out_baseline: false
loss_fn:
  force_on_policy_ratio: false
checkpointing:
  checkpoint_dir: results/sciprobe-lightning-overfit-canary-r1
  save_period: 6
  checkpoint_must_save_by: 00:01:50:00
policy:
  train_global_batch_size: 16
  max_total_sequence_length: 4096
  optimizer:
    kwargs:
      lr: 5.0e-06
  generation:
    max_new_tokens: 512
    temperature: 1.3
    val_temperature: 1.3
    val_top_p: 1.0
    val_top_k: null
data:
  train:
    data_path: examples/data/sciprobe/stateful-choice-overfit-canary.jsonl
    repeat: 80
  validation:
    dataset_name: NemoGymDataset
    data_path: examples/data/sciprobe/stateful-choice-overfit-canary.jsonl
env:
  nemo_gym:
    retain_token_audit: true
    nemo_gym_log_dir: results/sciprobe-lightning-overfit-canary-r1/nemo-gym
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - responses_api_agents/sciprobe_simple_agent/configs/sciprobe_simple_agent.yaml
    - resources_servers/sciprobe_overfit_checks/configs/sciprobe_overfit_checks.yaml
    - resources_servers/sciprobe_ns_tools/configs/sciprobe_ns_tools.yaml
    ns_tools_simple_agent:
      responses_api_agents:
        sciprobe_simple_agent:
          max_steps: 6
    ns_tools:
      resources_servers:
        sciprobe_ns_tools:
          default_verifier: sciprobe_overfit_checks
          verifiers:
            _delete_key: sciprobe_checks
            sciprobe_overfit_checks:
              type: resources_servers
              name: sciprobe_overfit_checks
logger:
  log_dir: results/sciprobe-lightning-overfit-canary-r1/logs
  wandb:
    name: lightning-overfit-canary-r1
