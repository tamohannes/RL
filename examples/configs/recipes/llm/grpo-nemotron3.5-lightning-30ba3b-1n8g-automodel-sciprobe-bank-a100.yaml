# GRPO over a SciProbe bank on one node of 8x A100 80GB.
#
# The canary chain below it trains one probe for one step, which is the right
# shape for proving the plumbing and the wrong shape for a bank. Three knobs
# move, and one inherited default is corrected.
#
# Several probes per step, because GRPO's advantage is zero for a group whose
# rollouts all agree. A hard probe usually produces eight wrong answers and
# therefore no gradient at all, so a single probe per step makes the run's
# outcome a coin flip on which probe came first. Four probes per step gives four
# independent chances of a mixed group.
#
# train_global_batch_size tracks the product. loss_fn.force_on_policy_ratio is
# true in this chain, which requires
# train_global_batch_size == num_prompts_per_step * num_generations_per_prompt.
# 4 x 8 = 32. Memory does not move with it: train_micro_batch_size stays 1 and
# the rest is gradient accumulation.
#
# exec_timeout_s is the correction. The chain inherits 30 seconds from the tool
# canary, whose task was a toy. These probes recompute a scientific result from
# real data with pandas, scipy or R, and 30 seconds silently truncates that work
# into a wrong answer. A timeout and a genuinely wrong answer are the same
# reward, so leaving it would make an infrastructure limit look like a model
# failure. The sandbox gate pins NUM_WORKERS=1, so tool calls serialise per node
# and this cannot be unbounded either; 120 seconds is the compromise.
defaults: grpo-nemotron3.5-lightning-30ba3b-1n8g-automodel-sciprobe-signal-a100.yaml

grpo:
  # One prompt per step, and the probes come from stepping rather than from
  # widening the batch.
  #
  # The synchronous NeMo-Gym path calls the rollout with
  # num_generations=input_batch.size and returns_entire_batch=True, so the whole
  # batch is one prompt group. Four probes in a batch then trip the invariant
  # that a group carries a single _ng_task_index, which is what reward
  # attribution rests on. That is an upstream constraint, not something to route
  # around in a recipe.
  #
  # Six steps of one probe gives the same six chances at a group whose rollouts
  # disagree, which is what a nonzero advantage needs, and it reads more clearly
  # per probe besides.
  num_prompts_per_step: 1
  max_num_steps: 6

policy:
  # Tracks num_prompts_per_step * num_generations_per_prompt, which
  # loss_fn.force_on_policy_ratio requires. 1 * 8.
  train_global_batch_size: 8

  # The canary chain sizes the window for a single-turn task. These episodes are
  # multi-turn: the task, every tool call, every block of tool output and the
  # reasoning between them all accumulate in one prompt. At 12288 that prompt
  # outgrew the window part way through the first batch, vLLM refused it with
  # "Prompt length (12313) fills or exceeds max_model_len", and the rollout
  # surfaced as an HTTP 500 that failed the whole run. Five of the first thirteen
  # rollouts reached that limit, three of them fatally, so it was the common case
  # rather than an outlier.
  #
  # The checkpoint itself allows 262144, so this is a recipe limit and not a model
  # one. 32768 leaves real headroom for tool output while keeping the training
  # sequence short enough to stay within an 80GB card at micro batch 1 with
  # activation checkpointing on.
  # 32768, restored once generation stopped holding half the card.
  #
  # Peak training memory has a floor here: the forward materialises a
  # [batch, seq, vocab] logit tensor and the loss reads it afterwards, so
  # logprob_chunk_size cannot shrink it. At 32768 that tensor is 16 GiB
  # (131072 vocab x 32768 x 4 bytes) and at 16384 it is 8 GiB.
  #
  # Shrinking it to 8 GiB was treating the symptom. The OOM that explained the
  # rest asked for 8.00 GiB and failed with 6.38 GiB free because 68.95 GiB was
  # already allocated, most of it reserved by colocated generation. With
  # gpu_memory_utilization at 0.3 there is room for the 16 GiB tensor again, and
  # 16384 was too short for these episodes: it traded OOM for context overflow,
  # three rollouts on step 2.
  #
  # If a longer window is ever needed than this, Megatron's
  # use_fused_linear_logprobs avoids materialising the tensor at all and is
  # documented as reaching past 100K. It is not available on the DTensor
  # automodel path this recipe uses.
  max_total_sequence_length: 32768

  # Chunk the logprob computation along the sequence.
  #
  # Both OOMs were the logits tensor, not activations in general. The failed
  # allocation was 16.00 GiB, which is about vocab x 32768 x 4 bytes: the whole
  # sequence's logits cast to float32 at once. Step 1 of a run would fit and
  # step 2 would not, because the size tracks each probe's episode length, which
  # is why moving the step cap only changed which step died.
  #
  # Chunking casts and gathers per slice instead, so peak logits memory becomes
  # 2048 rather than 32768 wide, roughly a gigabyte in place of sixteen. This is
  # what the field is for: "chunked along the sequence dimension to avoid GPU
  # OOM (especially during backward pass)". It is honoured on this path by
  # nemo_rl/models/automodel/train.py.
  logprob_chunk_size: 2048

  generation:
    # 3072 per turn instead of 8192. The budget is per generation, and an episode
    # accumulates every turn into one prompt, so this is what actually decides
    # how long a twenty-step episode gets. The traces do not need 8192: the tool
    # calls are short snippets and the reasoning between them is a few
    # paragraphs. Spending the sequence budget on more turns rather than on a
    # larger per-turn ceiling is the trade that keeps both the step cap and the
    # training step alive.
    # 1536, which is arithmetic rather than preference. Twenty steps have to fit
    # inside 16384 along with the task and the tool output, so the per-turn
    # ceiling is the only free variable left.
    #
    # The two failures bracket it. At 32768 with 3072 per turn the training step
    # died on the logit tensor. At 16384 with 3072 the training step was fine and
    # generation overflowed instead, three rollouts on step 2. The window that
    # trains and the window an episode wants do not overlap at that per-turn
    # size, so the per-turn size is what moves.
    #
    # 1536 is still a substantial turn: the traces show a few paragraphs of
    # reasoning and a short code block, nothing near even the old 8192.
    max_new_tokens: 1536

    vllm_cfg:
      # Give generation less of the card so training can have more.
      #
      # The last OOM is the one that explains the earlier ones. The allocation
      # was 8.00 GiB, exactly the logit tensor at 16384, and it failed with 6.38
      # GiB free because 68.95 GiB was already allocated. Training was never
      # working with 80GB. Generation is colocated and holds
      # gpu_memory_utilization of the card, so at 0.5 roughly 40GB was reserved
      # before training asked for anything.
      #
      # 0.3 is affordable by measurement, not by guess: at 0.5 the engine
      # reported a KV cache of 1,635,914 tokens, and eight concurrent rollouts at
      # 16384 need about 131k. Even after the weights take their share this
      # leaves several times the requirement.
      gpu_memory_utilization: 0.3

  tokenizer:
    chat_template_kwargs:
      # Drop earlier turns' reasoning from the prompt.
      #
      # The chain inherits truncate_history_thinking false alongside
      # enable_thinking true, so every turn's full chain of thought stays in the
      # prompt for every later turn. On a multi-turn tool episode that is the
      # dominant term, and it is what exhausts the window: at both 12288 and
      # 32768 the overflow was exactly 25 tokens, because a generation is clamped
      # to end exactly at the limit and the next turn's template scaffolding then
      # does not fit. That is structural, so a larger window only postpones it.
      #
      # Tool calls and their results are still carried; only the reasoning is
      # dropped, which is how these models are meant to be driven across turns.
      truncate_history_thinking: true

checkpointing:
  # The signal canary allowed 50 minutes because it ran a single step.
  checkpoint_must_save_by: 00:03:30:00
  # The canary saved every step, which it could afford at one step. Writing a
  # 30B checkpoint after each of six would cost more wall clock than the six
  # steps do, so save once at the end instead.
  save_period: 6

env:
  nemo_gym:
    ns_tools_simple_agent:
      responses_api_agents:
        sciprobe_simple_agent:
          # Bound the episode. The agent shipped with max_steps 50, and nothing
          # else stops it, so an episode that never converges keeps calling tools
          # until the prompt fills the window. That is what produced the
          # overflow: at 12288, at 32768, and again at 32768 with history
          # reasoning dropped, always by exactly 25 tokens, because a generation
          # is clamped to end exactly at the limit and the next turn's template
          # then does not fit. The window was never the variable.
          #
          # Twenty-four, measured rather than guessed. Sixteen was the first
          # try and it was too tight: on the first probe five of eight rollouts
          # stopped at exactly sixteen calls having emitted no answer, so the
          # cap and not the model produced most of that group's zeros. The three
          # that did finish used twelve and thirteen calls, so the working range
          # sits just above the old ceiling.
          #
          # Still a cap, because an unbounded episode fills the context window
          # and takes the whole run down with it, which is what fifty did. With
          # history reasoning dropped the per-step cost is much lower, so this
          # has room before it approaches 32768.
          # Twenty, bounded from both sides by measurement rather than taste.
          #
          # Sixteen was too low: on the first probe five of eight rollouts
          # stopped there having emitted no answer, so the cap produced most of
          # that group's zeros. Twenty-four was too high, but for an unrelated
          # reason: generation was clean, and the training step then died in
          # backward with "Tried to allocate 15.34 GiB" against 14.38 GiB free.
          # Longer episodes mean longer training sequences, and an 80GB card ran
          # out by roughly a gigabyte.
          #
          # Sixteen trained without trouble and twenty-four missed narrowly, so
          # twenty keeps the memory profile close to the one that worked while
          # clearing the 12 to 16 calls the rollouts that did answer actually
          # used. For reference the upstream recipe for this model runs
          # max_total_sequence_length 9216 across four nodes; this one asks for
          # 32768 on one, so the sequence budget is the binding constraint here
          # and the step cap is how it is spent.
          # 14, chosen so the worst case fits the window with margin.
          #
          # Memory is no longer the constraint; the window is. With no cap
          # available on tool output (DirectPythonTool exposes only code,
          # session_id and timeout) the episode cannot be bounded exactly, so it
          # is bounded by arithmetic: 14 x 1536 is 21504 of generation, leaving
          # roughly 11k for the task and fourteen tool results inside 32768.
          #
          # 14 clears what the work actually needs. The rollouts that reached an
          # answer used 12 and 13 calls, and their whole tool execution took 4 to
          # 18 seconds, so outputs are small. What 14 cuts off is the spiral, and
          # a spiral that is cut off scores zero, which is honest, whereas one
          # that runs to the window ends the entire run.
          max_steps: 14
    ns_tools:
      resources_servers:
        sciprobe_ns_tools:
          nemo_skills_tool_overrides:
            DirectPythonTool:
              exec_timeout_s: 120
