# Signal canary on one node of 8x A100 80GB.
#
# The canary chain was tuned for one node of 4x GB300, where 288 GB per GPU made
# 1152 GB available and let activation checkpointing stay off. An 80 GB card is a
# different machine, and one node of eight gives 640 GB.
#
# It has to be one node. SciProbe's hardening is single-node by construction:
# ray.sub refuses RAY_LOOPBACK_ONLY=1 on a multi-node job, and the hardened
# sandbox requires SANDBOX_FORCE_SINGLE_NODE=1. Spreading over two nodes would
# mean giving up loopback-only Ray and the sandbox's isolation, which is a much
# worse trade than paying for memory with recompute.
#
# 640 GB is enough because generation is colocated: NeMo RL sleeps vLLM during
# the training step and refits afterwards, so the peak is the larger of the two
# phases rather than their sum. Activation checkpointing carries the rest.
#
# Everything about the experiment is inherited unchanged: one real probe, eight
# generations, an 8192 token budget and a 12288 token context. Only placement and
# the accelerator-specific knobs move, so a difference in outcome is attributable
# to the hardware and not to the task.
defaults: grpo-nemotron3.5-lightning-30ba3b-1n4g-automodel-sciprobe-signal-canary.yaml

policy:
  dtensor_cfg:
    # Expert parallelism has to leave room for a data-parallel axis.
    #
    # data_parallel_size is derived as world_size / (tp * cp * ep). One rank per
    # GPU meant 8 / (1 * 1 * 8) = 1, and with no DP axis FSDP has nothing to
    # shard along: experts were split 8 ways by EP while every non-expert
    # parameter, gradient and optimizer state sat in full on every GPU. The run
    # log confirms it, data_parallel_size=1, and so does the arithmetic, roughly
    # 27GB of sharded experts plus roughly 24GB of unsharded remainder plus
    # activations, against the 67.98 GiB PyTorch actually reported holding.
    #
    # That figure barely moved when generation's share of the card was cut from
    # 0.5 to 0.3, which is what showed the resident state and not the KV cache
    # was the problem all along.
    #
    # ep=2 gives 8 / (1 * 1 * 2) = 4. Experts stay split 8 ways in total, ep
    # times dp, and the remainder is finally divided by 4 instead of held whole.
    # The four-node reference this recipe descends from runs ep=8 because 32
    # GPUs still leave dp=4; copying the number onto one node did not copy that
    # property.
    expert_parallel_size: 2

    # Back on. The canary could afford to keep activations resident on a 288 GB
    # card; at 80 GB the memory matters more than the recompute.
    activation_checkpointing: true

    # Keep parameters and gradients on the host between uses.
    #
    # The last OOM missed by about 250MB: it asked for 7.28 GiB with 7.02 GiB
    # free and 65.03 GiB resident. That resident figure is not the KV cache and
    # is barely affected by the parallelism layout; dropping expert parallelism
    # from 8 to 2 to give FSDP a data-parallel axis moved it only from 67.98 to
    # 65.03 GiB. It is the optimizer: TE FusedAdam here keeps bf16 moments but
    # also master_weights, an fp32 copy of every parameter, so params, grads,
    # master weights and two moments come to roughly 37GB before activations.
    #
    # Offloading to host memory buys back far more than the margin needed, and
    # the node has 1.8TB of it. The cost is a slower optimizer step, which is
    # the cheapest thing to spend here: generation takes 12 to 20 minutes per
    # step and training takes two or three.
    cpu_offload: true
    moe_parallelizer:
      ignore_router_for_ac: true

    env_vars:
      # The canary pinned this to False for exact single-step reproducibility on
      # GB300. Fragmentation is the binding constraint at 80 GB, so follow the
      # upstream reference instead.
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

    automodel_kwargs:
      # Keep MTP off: the checkpoint's mtp.* tensors are not trained here.
      num_nextn_predict_layers: 0
      backend:
        _target_: nemo_automodel.components.models.common.utils.BackendConfig
        attn: te
        linear: te
        rms_norm: torch_fp32
        experts: gmm
        # Neither of the two dispatchers the other recipes use is a safe default
        # here. `hybridep` was chosen for GB300 and `deepep` is what the H100
        # reference uses; both are accelerator-specific. `torch` is the generic
        # DTensor all-gather/reduce-scatter path, so it is the honest starting
        # point on Ampere. Try `deepep` only after this run works.
        dispatcher: torch
        rope_fusion: false
        enable_hf_state_dict_adapter: true

cluster:
  gpus_per_node: 8
  num_nodes: 1
