defaults: grpo-nemotron3.5-lightning-30ba3b-1n4g-automodel-sciprobe-canary.yaml
grpo:
  max_val_samples: null
checkpointing:
  checkpoint_dir: results/sciprobe-lightning-tool-canary-r1
policy:
  tokenizer:
    chat_template_kwargs:
      enable_thinking: true
      truncate_history_thinking: false
  max_total_sequence_length: 4096
  generation:
    max_new_tokens: 2048
    vllm_cfg:
      async_engine: true
      expose_http_server: true
      reasoning_parser_plugin: nemo_rl/models/generation/vllm/reasoning_parsers/nano_v3_reasoning_parser.py
      http_server_serving_chat_kwargs:
        enable_auto_tools: true
        tool_parser: qwen3_coder
        reasoning_parser: nano_v3
data:
  max_input_seq_length: null
  train:
    dataset_name: NemoGymDataset
    data_path: examples/data/sciprobe/stateful-python-session-canary.jsonl
  default:
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
env:
  should_use_nemo_gym: true
  should_log_nemo_gym_responses: false
  should_mask_flagged_samples: true
  nemo_gym:
    nemo_gym_log_dir: results/sciprobe-lightning-tool-canary-r1/nemo-gym
    skip_venv_if_present: true
    num_gpu_nodes: 0
    port_range_low: 5000
    port_range_high: 5999
    invalid_tool_call_patterns:
    - <tool_call>
    - </tool_call>
    - <function_call>
    - </function_call>
    thinking_tags:
    - <think>
    - </think>
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/math_with_judge/configs/math_with_judge.yaml
    - resources_servers/ns_tools/configs/ns_tools.yaml
    policy_model:
      responses_api_models:
        vllm_model:
          num_workers: 1
          chat_template_kwargs:
            enable_thinking: true
            truncate_history_thinking: false
          sequential_reasoning_allowed: false
    math_with_judge:
      resources_servers:
        math_with_judge:
          should_use_judge: false
          judge_model_server:
            name: policy_model
    ns_tools:
      resources_servers:
        ns_tools:
          verbose_tool_logging: true
          disable_session_restore: true
          nemo_skills_tool_overrides:
            DirectPythonTool:
              exec_timeout_s: 30
logger:
  log_dir: results/sciprobe-lightning-tool-canary-r1/logs
  wandb_enabled: true
  wandb:
    name: lightning-tool-canary-r1
    mode: offline
    log_nemo_gym_full_result_tables: true
