# Minimal dry-run config used to bake every NeMo Gym component required by the
# SciProbe signal recipe into the training image.
env:
  should_use_nemo_gym: true
  nemo_gym:
    skip_venv_if_present: true
    port_range_low: 5000
    port_range_high: 5999
    policy_model_name: dummy-model
    policy_base_url: http://localhost:8000/v1
    policy_api_key: dummy
    config_paths:
      - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
      - responses_api_agents/sciprobe_simple_agent/configs/sciprobe_simple_agent.yaml
      - resources_servers/sciprobe_checks/configs/sciprobe_checks.yaml
      - resources_servers/sciprobe_ns_tools/configs/sciprobe_ns_tools.yaml
    policy_model:
      responses_api_models:
        vllm_model:
          num_workers: 1
          chat_template_kwargs:
            enable_thinking: true
            truncate_history_thinking: false
          sequential_reasoning_allowed: false
    ns_tools:
      resources_servers:
        _delete_key: ns_tools
        sciprobe_ns_tools:
          default_verifier: sciprobe_checks
          verifiers:
            sciprobe_checks:
              type: resources_servers
              name: sciprobe_checks
          nemo_skills_tool_overrides:
            DirectPythonTool:
              exec_timeout_s: 30
