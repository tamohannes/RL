# Minimal dry-run config for baking only the NeMo Gym services used by the
# SciProbe stateful-Python canary into the training image.
env:
  should_use_nemo_gym: true
  nemo_gym:
    # Rebuild during image creation so an older release image cannot silently
    # supply Gym environments from a different source revision.
    skip_venv_if_present: false
    port_range_low: 5000
    port_range_high: 5999
    policy_model_name: dummy-model
    policy_base_url: http://localhost:8000/v1
    policy_api_key: dummy
    config_paths:
      - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
      - resources_servers/math_with_judge/configs/math_with_judge.yaml
      - resources_servers/ns_tools/configs/ns_tools.yaml
    policy_model:
      responses_api_models:
        vllm_model:
          num_workers: 1
          chat_template_kwargs:
            enable_thinking: true
            truncate_history_thinking: false
          sequential_reasoning_allowed: false
    math_with_judge:
      resources_servers:
        math_with_judge:
          should_use_judge: false
          judge_model_server:
            name: policy_model
